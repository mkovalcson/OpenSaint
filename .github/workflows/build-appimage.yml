name: Build Steam Controller AppImage

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make build scripts executable
        run: |
          chmod +x controller/appimage/build-docker.sh
          chmod +x controller/appimage/build-bundle.sh

      - name: Build Steam Deck compatible AppImage
        run: |
          controller/appimage/build-docker.sh --rebuild-image

      - name: Locate built AppImage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p controller/release

          CACHE_OUTPUT="$HOME/.cache/saint-os/controller-appimage/target/release/bundle/appimage"
          STAGED_OUTPUT="$GITHUB_WORKSPACE/server/resources/firmware/controller"

          echo "========================================"
          echo "Searching for completed AppImage"
          echo "========================================"
          echo

          echo "Cache output:"
          echo "$CACHE_OUTPUT"

          if [ -d "$CACHE_OUTPUT" ]; then
            find "$CACHE_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name '*.AppImage' \
              -ls || true
          else
            echo "Cache output directory does not exist."
          fi

          echo
          echo "Staged output:"
          echo "$STAGED_OUTPUT"

          if [ -d "$STAGED_OUTPUT" ]; then
            find "$STAGED_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name '*.AppImage' \
              -ls || true
          else
            echo "Staged output directory does not exist."
          fi

          appimage=""

          # Prefer the AppImage staged by build-bundle.sh.
          if [ -d "$STAGED_OUTPUT" ]; then
            appimage="$(find "$STAGED_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name '*.AppImage' \
              -print \
              -quit || true)"
          fi

          # Fall back to the custom Cargo/AppImage build output.
          if [ -z "$appimage" ] && [ -d "$CACHE_OUTPUT" ]; then
            appimage="$(find "$CACHE_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name '*.AppImage' \
              -print \
              -quit || true)"
          fi

          if [ -z "$appimage" ]; then
            echo
            echo "ERROR: No AppImage was produced."
            echo
            echo "Searching entire workspace and build cache:"
            find "$GITHUB_WORKSPACE" \
              "$HOME/.cache/saint-os/controller-appimage" \
              -type f \
              -name '*.AppImage' \
              -print 2>/dev/null || true
            exit 1
          fi

          echo
          echo "Using AppImage:"
          echo "$appimage"

          cp "$appimage" controller/release/SAINT-Controller.AppImage
          chmod +x controller/release/SAINT-Controller.AppImage

          sha256sum controller/release/SAINT-Controller.AppImage \
            > controller/release/SAINT-Controller.AppImage.sha256

          echo
          echo "Release directory:"
          ls -lh controller/release

      - name: Verify Steam Deck AppImage packaging
        shell: bash
        run: |
          set -euo pipefail

          cd controller/release

          rm -rf squashfs-root

          echo "========================================"
          echo "Extracting AppImage for verification"
          echo "========================================"

          ./SAINT-Controller.AppImage --appimage-extract >/dev/null

          echo
          echo "Checking WebKit helper processes..."

          WEB_PROCESS="$(find squashfs-root \
            -type f \
            -name 'WebKitWebProcess' \
            -print \
            -quit)"

          NETWORK_PROCESS="$(find squashfs-root \
            -type f \
            -name 'WebKitNetworkProcess' \
            -print \
            -quit)"

          GPU_PROCESS="$(find squashfs-root \
            -type f \
            -name 'WebKitGPUProcess' \
            -print \
            -quit || true)"

          SHIM="$(find squashfs-root \
            -type f \
            -name 'libpath-shim.so' \
            -print \
            -quit)"

          echo
          echo "WebKitWebProcess:"
          echo "  ${WEB_PROCESS:-NOT FOUND}"

          echo
          echo "WebKitNetworkProcess:"
          echo "  ${NETWORK_PROCESS:-NOT FOUND}"

          echo
          echo "WebKitGPUProcess:"
          echo "  ${GPU_PROCESS:-NOT FOUND}"

          echo
          echo "Path shim:"
          echo "  ${SHIM:-NOT FOUND}"

          if [ -z "$WEB_PROCESS" ]; then
            echo
            echo "ERROR: WebKitWebProcess is missing."
            exit 1
          fi

          if [ -z "$NETWORK_PROCESS" ]; then
            echo
            echo "ERROR: WebKitNetworkProcess is missing."
            exit 1
          fi

          if [ -z "$SHIM" ]; then
            echo
            echo "ERROR: libpath-shim.so is missing."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Checking AppRun"
          echo "========================================"

          if [ ! -f squashfs-root/AppRun ]; then
            echo "ERROR: AppRun is missing."
            exit 1
          fi

          echo
          echo "AppRun contents:"
          echo "----------------------------------------"
          cat squashfs-root/AppRun
          echo "----------------------------------------"

          if ! grep -q 'LD_PRELOAD' squashfs-root/AppRun; then
            echo
            echo "ERROR: AppRun does not configure LD_PRELOAD."
            exit 1
          fi

          if ! grep -q 'libpath-shim.so' squashfs-root/AppRun; then
            echo
            echo "ERROR: AppRun does not reference libpath-shim.so."
            exit 1
          fi

          if ! grep -Fq 'cd "$APPDIR/usr"' squashfs-root/AppRun; then
            echo
            echo 'ERROR: AppRun does not contain: cd "$APPDIR/usr"'
            exit 1
          fi

          if ! grep -Fq 'exec "$APPDIR/usr/bin/saint-controller"' squashfs-root/AppRun; then
            echo
            echo "ERROR: AppRun does not launch saint-controller correctly."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Steam Deck packaging verification PASSED"
          echo "========================================"

          rm -rf squashfs-root

      - name: Show final artifact information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final AppImage"
          echo "========================================"

          ls -lh controller/release/SAINT-Controller.AppImage

          echo
          echo "SHA256:"
          cat controller/release/SAINT-Controller.AppImage.sha256

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SAINT-Controller-AppImage
          path: |
            controller/release/SAINT-Controller.AppImage
            controller/release/SAINT-Controller.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
