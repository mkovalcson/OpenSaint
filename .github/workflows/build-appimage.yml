name: Build Steam Controller AppImage

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make build scripts executable
        run: |
          chmod +x controller/appimage/build-docker.sh
          chmod +x controller/appimage/build-bundle.sh

      - name: Build Steam Deck AppImage
        run: |
          controller/appimage/build-docker.sh --rebuild-image

      - name: Normalize AppImage filename
        shell: bash
        run: |
          mkdir -p controller/release

          appimage="$(find server/resources/firmware/controller \
            -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            -print \
            -quit)"

          if [ -z "$appimage" ]; then
            echo "No AppImage produced"
            exit 1
          fi

          cp "$appimage" controller/release/SAINT-Controller.AppImage
          chmod +x controller/release/SAINT-Controller.AppImage

          sha256sum controller/release/SAINT-Controller.AppImage \
            > controller/release/SAINT-Controller.AppImage.sha256

          echo "Built:"
          ls -lh controller/release/SAINT-Controller.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SAINT-Controller-AppImage
          path: |
            controller/release/SAINT-Controller.AppImage
            controller/release/SAINT-Controller.AppImage.sha256
          if-no-files-found: error
